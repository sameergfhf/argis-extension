<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060B15" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="AEGIS scores API security from live evidence — TLS, headers, leakage, and threat reputation in one precise report."
    />
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem('aegis-theme');
          document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AEGIS — API security, scored</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
